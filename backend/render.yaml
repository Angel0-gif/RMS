databases:
  - name: rms-db
    plan: free

services:
  - type: web
    name: restaurant-ms-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_demo"
    startCommand: "gunicorn config.wsgi"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: rms-db
          property: connectionString
      - key: FRONTEND_URL
        value: ""
      - key: CAMPAY_MODE
        value: simulate
