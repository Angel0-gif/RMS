<app-page-header title="Billing 💰" subtitle="Payment and invoice management"></app-page-header>

<div class="page-body">
  <!-- Summary cards -->
  <div class="stats-row">
    <app-stat-card icon="✅" [value]="(totalPaid | number) + ' XAF'" label="Paid Revenue" color="#28a745"></app-stat-card>
    <app-stat-card icon="⏳" [value]="(totalUnpaid | number) + ' XAF'" label="Unpaid Amount" color="#ffc107"></app-stat-card>
    <app-stat-card icon="✅" [value]="paidCount" label="Paid Invoices" color="#0d6efd"></app-stat-card>
    <app-stat-card icon="📄" [value]="unpaidCount" label="Unpaid Invoices" color="#dc3545"></app-stat-card>
    <app-stat-card icon="📦" [value]="orders.length" label="Total Orders" color="#6c757d"></app-stat-card>
  </div>

  <!-- Payment filter -->
  <div class="filter-pills">
    <button class="pill" [class.active]="filterPayment === ''" (click)="filterPayment = ''">All ({{orders.length}})</button>
    <button class="pill" [class.active]="filterPayment === 'unpaid'" (click)="filterPayment = 'unpaid'">⏳ Unpaid ({{unpaidCount}})</button>
    <button class="pill" [class.active]="filterPayment === 'paid'" (click)="filterPayment = 'paid'">✅ Paid ({{paidCount}})</button>
  </div>

  <div class="text-center py-4" *ngIf="loading"><div class="spinner-border text-warning" style="width:3rem;height:3rem"></div></div>

  <div class="bill-grid" *ngIf="!loading">
    <div *ngFor="let o of filtered" class="bill-card">
      <div class="bill-top">
        <div>
          <div class="bill-id">Invoice #{{o.id}}</div>
          <div class="text-muted" style="margin-top:.15rem;font-size:.82rem">{{o.user_name}}</div>
        </div>
        <div class="bill-total">{{o.total_amount | number}} XAF</div>
      </div>
      <div class="bill-meta">
        <span>
          <span [class]="statusClass(o.status)">{{o.status}}</span>
          <span [class]="'badge ms-1 bg-' + (o.payment_status === 'paid' ? 'success' : 'warning')">{{o.payment_status}}</span>
        </span>
        <span>📅 {{o.created_at | date:'MMM d, y • h:mm a'}}</span>
        <span>🍽️ {{o.items?.length || 0}} item(s){{o.table_number ? ' · Table ' + o.table_number : ''}}</span>
        <span *ngIf="o.payment_method">💳 {{o.payment_method | titlecase}}</span>
      </div>
      <div class="bill-acts">
        <button *ngIf="o.payment_status === 'unpaid' && o.status !== 'cancelled'" class="btn-sm btn-pay" (click)="markPaid(o.id)">Mark Paid</button>
      </div>
    </div>

    <div *ngIf="!filtered.length" style="grid-column:1/-1;background:#fff;border-radius:14px;padding:3rem;text-align:center;color:#aaa">
      No invoices found.
    </div>
  </div>
</div>
